name: Scheduled-service baseline (weekly)

# Refresh state/service_weight_baseline.json -- the per-directional-platform
# scheduled-train counts the live platform-crowding estimate splits a complex's
# entry demand by (training/service_weight.py), instead of splitting evenly and
# over-allocating a low-service platform at a busy complex.
#
# WEEKLY, alongside the ridership baseline. The source is the static GTFS
# schedule, which MTA republishes only on a service change (every few months),
# so a tighter cadence would re-fetch an unchanged zip; weekly keeps the
# baseline current relative to how fast the schedule actually moves.
on:
  schedule:
    - cron: '30 6 * * 0'  # 06:30 UTC every Sunday, after the ridership run.
  workflow_dispatch:      # manual refresh

concurrency:
  group: service-weight-baseline
  cancel-in-progress: false

# Read-only by default (R2 I/O rides murk/MURK_KEY, never the repo); the
# failure-alert step is granted issues: write per-job.
permissions:
  contents: read

jobs:
  service-weight-baseline:
    runs-on: ubuntu-latest
    # issues: write for the failure tracking issue; contents: read for checkout.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Refresh the scheduled-service baseline
        run: uv run python -m training.service_weight
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # A red run only emails the workflow file's last committer, which is easy
      # to miss; a tracking issue is visible to everyone and de-duplicates across
      # repeated failures. No checkout dependency here, so gh needs GH_REPO.
      - name: Open or update the tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Weekly scheduled-service baseline refresh is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="\`${{ github.workflow }}\` failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

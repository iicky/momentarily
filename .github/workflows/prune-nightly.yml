name: Archive + prune R2 (nightly)

# Nightly R2 archive upkeep: store the static feed, DERIVE the traversal and
# announced-window archives, prune expired params rollback snapshots, then
# derive yesterday's recorded observations (model/observations/s1/derived/),
# and extend the layer-1 network day map and builds (model/network/s1/).
#
# RETENTION: every date-partitioned archive/ and v1/ stream is kept in full,
# indefinitely, by owner decision. The raw captures record live feeds that
# cannot be fetched again, so nothing here deletes them; training.prune only
# removes state/params/v<epoch>.json rollback snapshots past their window.
#
# The derive steps still run every night ahead of the prune step, but they no
# longer race a deletion of their sources: the raw streams they read are never
# pruned.
#
# HMM training is NOT here — it runs weekly in the Cloudflare Container
# (trainer/, Sunday 05:00 UTC) as the single source of state/params.json. This
# workflow used to also retrain nightly, which made params retrain daily and
# raced the container on Sundays; that was retired in favour of the weekly
# container. See ADR 0001.

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC daily. GHA cron is best-effort.
  workflow_dispatch:      # manual prune
    inputs:
      derive_day:
        description: "UTC day (YYYY-MM-DD) for the observations derive step; empty = yesterday"
        type: string
        default: ""

concurrency:
  group: prune-r2
  cancel-in-progress: false

# Read-only by default; the failure-alert step is granted issues: write per-job.
permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    # issues: write for the failure tracking issue; contents: read for checkout.
    permissions:
      contents: read
      issues: write
    # The observations derive decodes about 1,440 invocations a day; measured
    # at about 0.24 s of CPU each, plus the R2 GETs (docs/model-observations.md
    # §4.2).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      # The static feed ARTIFACT, content-addressed. MTA serves no superseded
      # snapshots, so once it republishes the feed that priced last month's hops
      # is gone from the internet and cannot be recovered at any effort. This
      # step preserves the CANDIDATES so that recovery stays possible.
      #
      # It does NOT by itself make a day replayable. No day carries a proven
      # feed_digest yet — a backfill can only fetch the current feed, which is no
      # evidence about which bytes were live weeks ago — so every archived day
      # still records "feed unknown". Replay lands when the collection-time
      # writer records a digest beside each snapshot at poll time; until then
      # this is the necessary half, not the sufficient one.
      - name: Store the current static GTFS feed
        run: uv run python -m training.gtfs_archive
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # Derive and keep the traversal archive from the raw trace. The window is
      # a trailing self-healing span rather than just yesterday: GHA cron is
      # best-effort, so a missed night must be picked up by the next run, and
      # anything already written is skipped.
      - name: Derive the long-lived traversal archive
        run: |
          uv run python -m training.traversal_archive \
            --start-date "$(date -u -d '28 days ago' +%F)" \
            --end-date "$(date -u -d 'yesterday' +%F)"
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # The ANSWER KEY, derived on the same nightly path: without the parsed
      # windows the retained traversals cannot be graded against anything.
      #
      # ITS WINDOW MUST BE WIDER than the 28 days used above. Alerts are
      # archived as VERSIONS: an unchanged planned-work alert exists only on the
      # date it was published, so a closure announced two months ago and running
      # tonight appears nowhere in the last 28 days of alert objects and would
      # never be captured. 88 days covers that lead time; days already written
      # are skipped, so the cost is one listing plus the days actually missing.
      - name: Derive the long-lived announced-window archive
        run: |
          uv run python -m training.window_archive \
            --start-date "$(date -u -d '88 days ago' +%F)" \
            --end-date "$(date -u -d 'yesterday' +%F)"
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # Bucket creds are object-scoped (no R2 lifecycle rules), so params
      # rollback pruning rides this job. Dated archive/ and v1/ history is
      # never pruned (see the RETENTION note at the top).
      #
      # RETENTION NOTE: the PROV sidecars (state/prov/ and v1/prov/) are kept
      # FOREVER and are deliberately NOT swept by training.prune. One tiny
      # immutable doc per weekly run is negligible; the public v1/prov mirror is
      # immutable (max-age 1y) and is the target of every published snapshot's
      # prov_ref, so pruning it would strand lineage. Matches the RETENTION
      # comment in training/train_em.py.
      - name: Prune aged params rollback snapshots
        run: uv run python -m training.prune
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # Layer-2 derive of the previous UTC day: the recorder's ticks, bundles
      # and blobs to hourly parquet and the daily AlertVersion index. Last, so
      # a failure here never blocks the prune, and it runs even when an
      # earlier step failed: only one day is derived per night, so a skipped
      # day is never retried on its own. Recover a missed day with a manual
      # run and the derive_day input. A day is final once every invocation
      # scheduled before midnight has written, minutes after 00:00 UTC;
      # nothing filed under today is read. A day with no recorded ticks
      # (before the recorder deploys) is a clean no-op. Rerunning a day keeps
      # files whose content is unchanged and fails on a conflicting one;
      # replace those by hand with --overwrite.
      - name: Derive recorded observations (yesterday, or derive_day)
        if: ${{ !cancelled() }}
        run: |
          uv run python -m training.derive_observations \
            --day "${DERIVE_DAY:-$(date -u -d 'yesterday' +%F)}"
        env:
          DERIVE_DAY: ${{ inputs.derive_day }}
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # Layer 1: extend model/network/s1/day_feed_map.json through yesterday
      # from the recorder's gtfs_static HEAD ETags joined to the static-feed
      # captures (archive/gtfs/by_etag/), and build any feed the map names
      # that has no build yet (docs/model-network.md). It resumes after the
      # map's last day, so a missed night is caught up by the next run; a day
      # already mapped is never rewritten. Builds are never replaced, and the
      # index and map only by extensions of themselves: a conflict writes
      # nothing and fails the step. Prints object keys only.
      - name: Extend the network day map and build new feeds
        if: ${{ !cancelled() }}
        # About 1,440 tick GETs a day plus, rarely, a 5.6 MB zip and a build.
        timeout-minutes: 20
        run: uv run python -m training.network_update
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # A missed prune or failed archive-derive is invisible except for the
      # schedule-failure email; a tracking issue makes a dead nightly job loud.
      - name: Open or update the tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Nightly R2 archive + prune is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="\`${{ github.workflow }}\` failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

services:
  collector:
    build: .
    image: momentarily-collector:local
    container_name: momentarily-collector
    restart: unless-stopped
    # .env is optional — the MTA gateway feeds are served keyless (see
    # worker/src/fetch.ts). Kept as an opt-in hook for local env overrides.
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      POLL_INTERVAL_SECONDS: "300"
      ENE_POLL_INTERVAL_SECONDS: "3600"
      LOG_LEVEL: INFO
    volumes:
      # Host: ../data/ → container: /data
      - ../data:/data

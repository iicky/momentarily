name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the default GITHUB_TOKEN is read-only here. No job in this
# workflow needs to write repo contents — deploys authenticate to Cloudflare
# via the murk vault (MURK_KEY), not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  # The Worker is the production code path; this job also enforces the
  # TS<->Python parity pin (worker/test/parity_python.test.ts against
  # tests/fixtures/parity_forward.json), so hmm.py and hmm.ts can't drift
  # without a fixture regen.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # worker-configuration.d.ts is generated, not committed; wrangler types
      # is offline codegen and needs no credentials.
      - run: bun x wrangler types ./worker-configuration.d.ts
      - run: bun run typecheck
      # `bun run test`, not `bun test`: the suite is vitest (package.json), and
      # bun's own runner silently skips over vi.mock/vi.hoisted rather than
      # honouring them.
      - run: bun run test

  # The trainer Worker (container launcher) is a separate package; typecheck it
  # so a break there doesn't reach the Sunday cron unnoticed. No bun test — it
  # carries no tests yet.
  trainer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun x wrangler types ./worker-configuration.d.ts
      - run: bun run typecheck

  # viz/ is the local-only dashboard (not on the publish path), but its tests
  # and typecheck previously ran only in the local pre-commit hook, so a viz
  # break could land on main with green CI. Node 22 is mandatory: `npm test` is
  # `node --test tests/*.test.ts`, whose on-the-fly TS type-stripping needs
  # Node >=22.18. viz/.nvmrc is the single source of truth, shared with local nvm.
  viz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: viz/.nvmrc
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run css-check
      # Local-only dashboard, but the e2e pass is fully offline (feed mocked,
      # no secrets) and runs in well under a minute, so it gates here too. It
      # boots a production build and screenshots the five views at two
      # viewports; the screenshots are review artifacts, not committed.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # --- Deploy -------------------------------------------------------------
  # These deploy jobs wait on every check job — lint, type-check, test, worker,
  # trainer, and viz — so a red main can never ship. viz is included even
  # though the dashboard is not on the publish path: a red workflow must never
  # be routine. None of the six check jobs carries an `if` or a path filter, so
  # none can be skipped; a job that `needs` a skipped job is itself skipped, and
  # adding a conditional check job here would silently turn deploys off.

  deploy-publisher:
    needs: [lint, type-check, test, worker, trainer, viz]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize deploys against each other. Note the workflow-level
    # cancel-in-progress still applies: a second push to main cancels this run,
    # and that run deploys its own (newer) commit instead. If its checks fail
    # nothing deploys and code-drift-check.yml reports the gap — the intended
    # outcome when main is broken.
    concurrency:
      group: deploy-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Resolve Cloudflare credentials from the murk vault
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            value=$(uv run python -c 'import murk,sys; print(murk.get(sys.argv[1]))' "$key")
            if [ -z "$value" ]; then
              echo "::error::$key missing from the murk vault"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: worker
      # No `wrangler types` step: that generates worker-configuration.d.ts for
      # tsc, and wrangler bundles without typechecking. CI already typechecked.
      # deploy:ci is the same script `bun run deploy` uses locally, minus the
      # murk wrapper — the __GIT_SHA__ provenance define lives in one place.
      # No path filter on purpose: the code-drift check treats
      # "live code_sha == main HEAD" as the invariant, and a filtered deploy
      # would break it on any commit outside worker/.
      - name: Deploy publisher Worker
        run: bun run deploy:ci
        working-directory: worker
      # The snapshot is republished on the next 5-minute tick, so the new sha is
      # not observable yet; code-drift-check.yml is what verifies it landed.

  # The trainer deploy builds the Python container image (wrangler shells out to
  # Docker, which ubuntu-latest provides), so it is path-gated rather than
  # running on every push.
  deploy-trainer:
    needs: [lint, type-check, test, worker, trainer, viz]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-trainer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the trainer image changed
        id: scope
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          # A branch's first push, a force-push, or a rewritten history leaves
          # `before` unusable; fall back to the parent, and rebuild if even that
          # does not resolve (a root commit) rather than skipping silently.
          if [ -z "$before" ] \
            || [ "$before" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            if git rev-parse --verify --quiet '${{ github.sha }}^' >/dev/null; then
              before='${{ github.sha }}^'
            else
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Directory prefixes cover everything beneath them, manifests, lockfiles
          # and wrangler.toml included. .dockerignore is listed because it shapes
          # the image build context, which is the repo root.
          if git diff --quiet "$before" '${{ github.sha }}' -- \
            trainer/ training/ src/ pyproject.toml uv.lock .dockerignore; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "trainer image unchanged; skipping deploy"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.scope.outputs.rebuild == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
        if: steps.scope.outputs.rebuild == 'true'
      - name: Resolve Cloudflare credentials from the murk vault
        if: steps.scope.outputs.rebuild == 'true'
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            value=$(uv run python -c 'import murk,sys; print(murk.get(sys.argv[1]))' "$key")
            if [ -z "$value" ]; then
              echo "::error::$key missing from the murk vault"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.rebuild == 'true'
      - run: bun install --frozen-lockfile
        if: steps.scope.outputs.rebuild == 'true'
        working-directory: trainer
      # deploy:ci writes .build-sha (gitignored) before the image build, which is
      # how training/provenance.py stamps params.json from inside the container —
      # .git is excluded from the image, so `git rev-parse` cannot run there.
      - name: Deploy trainer Worker
        if: steps.scope.outputs.rebuild == 'true'
        run: bun run deploy:ci
        working-directory: trainer

  # A red run on main only emails the last committer, which is easy to miss;
  # this opens or updates a single tracking issue so a broken main is loud.
  alert-on-failure:
    needs: [lint, type-check, test, worker, trainer, viz, deploy-publisher, deploy-trainer]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI is red on main"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="\`${{ github.workflow }}\` failed on ${{ github.sha }} at $(date -u +%FT%TZ). Run: $RUN_URL"
          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

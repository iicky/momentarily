name: Ridership baseline (weekly)

# Refresh state/ridership_baseline.json -- the per-station-complex entry-rate
# baseline the live platform-crowding estimate multiplies by minutes-since-
# last-train (training/ridership.py).
#
# WEEKLY, NOT DAILY. The upstream feed (NYS Open Data 5wq4-mkjj) publishes
# with roughly a 10-day lag, so a daily run would mostly re-fetch a trailing
# 90-day window that has barely moved -- each of the two aggregate queries
# alone takes on the order of a minute against the live feed, so a tighter
# cadence buys close to nothing and just burns Socrata's rate limit and our
# own CI minutes. Weekly keeps the baseline's rolling window current relative
# to how fast the source data actually changes.
on:
  schedule:
    - cron: '0 6 * * 0'  # 06:00 UTC every Sunday. GHA cron is best-effort.
  workflow_dispatch:      # manual refresh

concurrency:
  group: ridership-baseline
  cancel-in-progress: false

# Read-only by default (R2 I/O rides murk/MURK_KEY, never the repo); the
# failure-alert step is granted issues: write per-job.
permissions:
  contents: read

jobs:
  ridership-baseline:
    runs-on: ubuntu-latest
    # issues: write for the failure tracking issue; contents: read for checkout.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Refresh the ridership entry-rate baseline
        run: uv run python -m training.ridership
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # A red run only emails the workflow file's last committer, which is easy
      # to miss; a tracking issue is visible to everyone and de-duplicates across
      # repeated failures. No checkout dependency here, so gh needs GH_REPO.
      - name: Open or update the tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Weekly ridership baseline refresh is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="\`${{ github.workflow }}\` failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

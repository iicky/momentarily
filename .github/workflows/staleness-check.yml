name: Snapshot staleness check

# External watchdog on the public feed: fails (and notifies via GitHub's
# workflow-failure email) when snapshot.json goes stale. Checks the tick
# clock (generated_at lag) AND the per-feed/model freshness sub-fields —
# vehicle_positions, ene, params_stale and provenance.params.trained_at —
# because generated_at is stamped every tick the alpha CAS wins and
# buildSnapshot doesn't throw, independent of whether any vehicle feed
# decoded, ENE is current, or params are live (worker/src/index.ts,
# snapshot.ts). Catches dead crons, CPU-limit outages, R2 publish failures,
# frozen feeds, and version-skewed params — the Worker can't report its own
# death. Public repo, so the cron costs nothing.

on:
  schedule:
    - cron: '*/15 * * * *'  # best-effort; GHA may delay under load
  workflow_dispatch:

# Read-only by default; the failure-alert step below is granted issues: write
# per-job so a dead feed surfaces as a tracking issue, not just a silent email.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Needs issues: write to open/comment the tracking issue on failure. No
    # checkout, so contents access is irrelevant; kept read for clarity.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 3
    steps:
      # Two-consecutive-run state for the vehicle_feeds check below. The prior
      # run's stale line-group set is restored so a one-tick feed blip that only
      # shows up in the single snapshot this run samples cannot alarm on its own —
      # freshness.vehicle_feeds carries no debounce of its own (see that block).
      # The key is per run ATTEMPT (run_id + run_attempt), so a re-run whose feed
      # recovered records its own fresh observation instead of being masked by the
      # first attempt's immutable cache. This attempt's key never exists at restore
      # time (it is saved below), so restore-keys always yields the newest prior
      # attempt; the check ignores it when its payload run_id matches this run (a
      # same-run re-run restore). No checkout needed (this job has none).
      - name: Restore previous vehicle_feeds staleness observation
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/vehicle_feeds_stale.json
          key: vehicle-feeds-stale-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vehicle-feeds-stale-
      - name: Check generated_at lag and freshness sub-fields
        run: |
          set -euo pipefail
          # Guarantee the carry file exists (first run, or a run whose snapshot
          # fetch fails before the vehicle_feeds block) so the save step below
          # never trips on a missing path. Does not clobber a restored set.
          test -f /tmp/vehicle_feeds_stale.json || echo '{"stale":[]}' > /tmp/vehicle_feeds_stale.json
          # Cache-bust past the CDN (s-maxage=300) so we measure the origin.
          url="https://feed.momentarily.nyc/v1/snapshot.json?cb=$(date +%s)"
          curl -fsS --max-time 30 -o /tmp/snapshot.json "$url"
          generated_at=$(jq -r '.generated_at // empty' /tmp/snapshot.json)
          if [ -z "$generated_at" ]; then
            echo "::error::could not parse generated_at from snapshot"
            exit 1
          fi
          now=$(date +%s)
          lag=$(( now - generated_at ))
          echo "generated_at=$generated_at now=$now lag=${lag}s"
          # Cron runs every 5 min; 3 missed ticks = something is wrong.
          if [ "$lag" -gt 900 ]; then
            echo "::error::generated_at: snapshot is ${lag}s stale (threshold 900s)"
            exit 1
          fi
          # Freshness sub-field ages are measured against generated_at, the
          # snapshot's own tick epoch, not wall-clock now: these timestamps are
          # internal to the snapshot, so comparing them to generated_at isolates
          # feed/model staleness from any GHA cron delay (the lag check above
          # already covers the tick clock).
          params_stale=$(jq -r '.freshness.params_stale' /tmp/snapshot.json)
          if [ "$params_stale" != "false" ]; then
            echo "::error::freshness.params_stale is ${params_stale} (expected false): params.json carried an unreadable schema_version, snapshot is running on bootstrap params"
            exit 1
          fi
          vp=$(jq -r '.freshness.vehicle_positions // empty' /tmp/snapshot.json)
          if [ -z "$vp" ]; then
            echo "::error::freshness.vehicle_positions is null: no GTFS-RT vehicle-position feed has ever round-tripped"
            exit 1
          fi
          vp_age=$(( generated_at - vp ))
          echo "vehicle_positions age=${vp_age}s ene age=$(( generated_at - $(jq -r '.freshness.ene // 0' /tmp/snapshot.json) ))s"
          # 1800s = worker/src/snapshot.ts MAX_MOVEMENT_STATE_AGE_SEC: past this
          # the movement surface ages out and falls back to the alert/HMM
          # condition, so a vehicle_positions age above it means the trains
          # surface is running blind.
          if [ "$vp_age" -gt 1800 ]; then
            echo "::error::freshness.vehicle_positions is ${vp_age}s behind generated_at (threshold 1800s = MAX_MOVEMENT_STATE_AGE_SEC)"
            exit 1
          fi
          ene=$(jq -r '.freshness.ene // empty' /tmp/snapshot.json)
          if [ -z "$ene" ]; then
            echo "::error::freshness.ene is null: no E&E snapshot has been recorded"
            exit 1
          fi
          ene_age=$(( generated_at - ene ))
          # 7200s = 2x worker/src/index.ts ENE_INTERVAL_SECONDS (hourly E&E
          # fetch). Looser than vehicle_positions because E&E is polled once an
          # hour: one missed hourly fetch is normal jitter, two is the alarm.
          if [ "$ene_age" -gt 7200 ]; then
            echo "::error::freshness.ene is ${ene_age}s behind generated_at (threshold 7200s = 2x ENE_INTERVAL_SECONDS)"
            exit 1
          fi
          trained_at=$(jq -r '.provenance.params.trained_at // empty' /tmp/snapshot.json)
          if [ -z "$trained_at" ]; then
            echo "::error::provenance.params.trained_at missing from snapshot"
            exit 1
          fi
          trained_age_days=$(( (generated_at - trained_at) / 86400 ))
          echo "trained_at age=${trained_age_days}d"
          # 45 days is the paused-cron reality: trainer/wrangler.toml has
          # crons=[], so params only move on a deliberate manual retrain and a
          # normal weekly bound would false-alarm. Tighten this toward the
          # weekly cadence when the cron is un-paused.
          if [ "$trained_age_days" -gt 45 ]; then
            echo "::error::provenance.params.trained_at is ${trained_age_days}d old (threshold 45d; the paused-cron reality, tighten when un-paused)"
            exit 1
          fi
          # --- vehicle_feeds per-group liveness (nzm1.23) ---
          # freshness.vehicle_feeds.stale names the trip-update line groups that
          # failed to round-trip THIS tick. vehicle_positions above only dates the
          # last decode of ANY group, so one group rejecting every tick stays
          # hidden behind the other seven's fresh stamp — this field is the only
          # per-group signal. It carries NO debounce: index.ts fetches the 8 groups
          # with Promise.allSettled and drops a rejected feed straight out of
          # vehicleFreshFeeds (fetch.ts fetchProtobuf throws on !ok / timeout /
          # empty-body, no retry), unlike the movement surface's 2-tick regime
          # debounce (movement_state.ts). So a single transient rejection on the
          # tick this run happens to sample would show a non-empty stale set.
          # Require the SAME group stale across two consecutive runs before
          # alarming: the prior run's set was restored above, the intersection is
          # what a persistent partial outage looks like — a one-tick blip is not.
          cur_stale=$(jq -c '(.freshness.vehicle_feeds // {}).stale // empty' /tmp/snapshot.json)
          if [ -z "$cur_stale" ]; then
            echo "::error::freshness.vehicle_feeds.stale missing from snapshot"
            exit 1
          fi
          # Read the prior run's observation, ignoring it in two cases so the gate
          # stays about two DISTINCT, CONSECUTIVE scheduled runs:
          #   - same run: github.run_id is stable across re-runs, so a re-run
          #     restores its own earlier attempt's cache as a hit; comparing
          #     against it would fabricate a two-run outage from one run's attempts.
          #   - stale carry: actions/cache is best-effort and restore-keys returns
          #     the newest SURVIVING prefix match, which after an eviction of the
          #     immediately-preceding entry could be a much older one. The payload
          #     stamps its recording epoch; anything older than 2h — well above the
          #     neighboring-run gap even with GHA cron delay, and well below the
          #     multi-day age of any evicted-then-resurrected cache — is not a
          #     neighbor and is not counted. A missed pairing only delays detection
          #     one cycle (safe); a resurrected cache cannot manufacture an alarm.
          prev_stale='[]'
          now=$(date +%s)
          if [ -s /tmp/vehicle_feeds_stale.json ]; then
            prev_run=$(jq -r '.run_id // ""' /tmp/vehicle_feeds_stale.json)
            prev_at=$(jq -r '.at // 0' /tmp/vehicle_feeds_stale.json)
            if [ "$prev_run" != "$GITHUB_RUN_ID" ] && [ "$prev_at" -gt 0 ] \
                && [ "$(( now - prev_at ))" -le 7200 ]; then
              prev_stale=$(jq -c '.stale // []' /tmp/vehicle_feeds_stale.json)
            fi
          fi
          # Record THIS run's set (run_id + epoch) for the save step — before any
          # exit below, so a failing run still records its observation.
          jq -cn --arg rid "$GITHUB_RUN_ID" --argjson at "$now" --argjson stale "$cur_stale" \
            '{run_id: $rid, at: $at, stale: $stale}' > /tmp/vehicle_feeds_stale.json
          echo "vehicle_feeds.stale this=$cur_stale prev=$prev_stale"
          # Intersection: groups stale in BOTH the previous run and this one.
          persistent=$(jq -cn --argjson a "$prev_stale" --argjson b "$cur_stale" '$a - ($a - $b)')
          if [ "$(jq 'length' <<<"$persistent")" -gt 0 ]; then
            groups=$(jq -r 'join(", ")' <<<"$persistent")
            echo "::error::freshness.vehicle_feeds.stale: line group(s) [$groups] failed to round-trip across two consecutive checks — a partial trip-update outage hidden behind a fresh vehicle_positions stamp"
            exit 1
          fi
      # Persist THIS attempt's stale set (tagged with its run_id) for the next
      # run's two-consecutive compare. always() so a run that fails any assertion
      # above still records the observation. The key includes run_attempt, so a
      # re-run saves its own record (newest wins on the next restore) rather than
      # colliding with the first attempt's immutable cache.
      - name: Save vehicle_feeds staleness observation
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/vehicle_feeds_stale.json
          key: vehicle-feeds-stale-${{ github.run_id }}-${{ github.run_attempt }}
      # A red run only emails the workflow file's last committer, which is easy
      # to miss; a tracking issue is visible to everyone and de-duplicates across
      # repeated failures. No checkout here, so gh needs GH_REPO explicitly.
      - name: Open or update the tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Snapshot staleness check is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="\`${{ github.workflow }}\` failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

name: Eval (daily)

# Self-grade the live publisher: read a trailing window of v1/predictions/ +
# v1/regime_transitions/ from R2, compute reliability + recovery accuracy,
# publish v1/eval.json. Public, max-age=300. Independent of the nightly
# trainer — they run as separate jobs with their own concurrency groups.
#
# 28 days, not 7. Per-tick n was never the sample size: six consecutive 7-day
# windows on the published arm carried 56k-58k tick-rows each (indistinguishable)
# and 5, 8, 8, 16, 26 and 89 incidents — a 17.8x swing in real support, so a
# week-over-week metric move said more about which week landed than about the
# model. 28 days quadruples the support and stays inside the era where
# published_condition exists (from 2026-07-11), so the movement arm is graded on
# its own data rather than falling back to the alert shadow. Fixed length rather
# than "everything retained": a window that grows each run changes its own
# denominator, which is the same confound wearing a different hat. Ceiling is
# training/prune.py's 90-day retention.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC. GHA cron is best-effort.
  workflow_dispatch:
    inputs:
      no_publish:
        description: "Print eval doc instead of writing v1/eval.json"
        type: boolean
        default: false

concurrency:
  group: eval-daily
  cancel-in-progress: false

# Read-only by default (R2 I/O rides murk/MURK_KEY, never the repo); the
# failure-alert step is granted issues: write per-job.
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # issues: write for the failure tracking issue; contents: read for checkout.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run eval
        run: uv run python -m training.eval --days 28 ${{ inputs.no_publish && '--no-publish' || '' }}
        env:
          MURK_KEY: ${{ secrets.MURK_KEY }}
      # A red run only emails the workflow file's last committer, which is easy
      # to miss; a tracking issue is visible to everyone and de-duplicates across
      # repeated failures. No checkout dependency here, so gh needs GH_REPO.
      - name: Open or update the tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Daily eval self-grade is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="\`${{ github.workflow }}\` failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
